services:
  mysql:
    image: mysql:5.7
    container_name: mysql-lab
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: lab_database
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - lab-net

  app:
    container_name: lab-app
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "npm run start"
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_USER: admin
      DB_PASSWORD: admin
      DB_NAME: lab_database
    ports:
      - "3000:3000"
    networks:
      - lab-net

volumes:
  mysql-data:

networks:
  lab-net:
    driver: bridge
