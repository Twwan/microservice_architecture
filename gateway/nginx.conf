events {

}

http {
  server {
    listen 80;
    server_name service-1;

    location /service-1/ {
      proxy_pass http://service-1:3000/;
    }
    location /service-2/ {
      proxy_pass http://service-2:3001/;
    }
    location /auth/ {
      proxy_pass http://auth-service:3002/;
    }
  }
}
