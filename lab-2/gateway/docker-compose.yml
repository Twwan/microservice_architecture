services:
  gateway:
    image: nginx:alpine
    container_name: gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./service-1:/etc/nginx/sites-enabled/service-1
      - ./service-2:/etc/nginx/sites-enabled/service-2
    networks:
      - lab2-net

networks:
  lab2-net:
    driver: bridge
