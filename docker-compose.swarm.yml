version: '3.8'

services:
  service-2:
    image: service-2:latest
    ports:
      - "3000:3000"
    environment:
      - SERVICE2_PORT=3000
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
    networks:
      - cluster-network

networks:
  cluster-network:
    driver: overlay

